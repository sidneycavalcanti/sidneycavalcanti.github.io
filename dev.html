<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status dos serviços</title>
<meta name="description" content="Status em tempo real dos serviços de que as empresas dependem: Microsoft 365, Google, AWS, pagamentos e mais.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Crect x='12' y='28' width='9' height='9' rx='3' fill='%23fff'/%3E%3Crect x='27' y='28' width='9' height='9' rx='3' fill='%23fff'/%3E%3Crect x='42' y='28' width='9' height='9' rx='3' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6fa;
  --surface: #ffffff;
  --line: #e2e7ef;
  --ink: #172033;
  --muted: #5f6b7f;
  --accent: #4f46e5;
  --ok: #16a34a;
  --minor: #ca8a04;
  --major: #ea580c;
  --critical: #dc2626;
  --maint: #2563eb;
  --off: #8792a2;
  --tint: 12%;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10141c; --surface: #171c26; --line: #262e3d; --ink: #e8ecf3; --muted: #9aa4b5;
    --accent: #8b85ff; --ok: #22c55e; --minor: #eab308; --major: #fb923c; --critical: #f87171;
    --maint: #60a5fa; --tint: 18%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.55 "Geist", system-ui, sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 72rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

/* cor de cada estado, usada por pontos, pilulas, barra e cartoes */
[data-nivel="ok"] { --c: var(--ok); }
[data-nivel="maint"] { --c: var(--maint); }
[data-nivel="minor"] { --c: var(--minor); }
[data-nivel="major"] { --c: var(--major); }
[data-nivel="critical"] { --c: var(--critical); }
[data-nivel="erro"], [data-nivel="espera"] { --c: var(--off); }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand { color: var(--muted); text-decoration: none; font-weight: 500; }
.brand:hover { color: var(--ink); }
.tools { display: flex; gap: .5rem; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: none; padding: .3rem .8rem; border-radius: 999px; cursor: pointer;
  font-weight: 600; font-size: .9rem; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.hero { padding: 3rem 0 2rem; }
h1 {
  font-size: clamp(2rem, 5.5vw, 3.4rem); font-weight: 700; line-height: 1.08; letter-spacing: -.03em;
  margin: 0 0 .75rem; max-width: 22ch; text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; max-width: 65ch; }

/* faixa: um segmento por servico, o quadro inteiro em uma linha */
.strip { display: flex; gap: 3px; margin: 2rem 0 .75rem; height: 2.6rem; }
.strip button {
  flex: 1; min-width: 0; border: 0; padding: 0; cursor: pointer; border-radius: 5px;
  background: var(--c); opacity: .9; transition: transform .15s, opacity .15s;
}
.strip button:first-child { border-radius: 10px 5px 5px 10px; }
.strip button:last-child { border-radius: 5px 10px 10px 5px; }
.strip button:hover { opacity: 1; transform: scaleY(1.12); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: .9rem; }
.legend li { display: flex; align-items: center; gap: .4rem; }

.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); flex: none; }
[data-nivel="major"] .dot, [data-nivel="critical"] .dot { animation: pulsa 2s ease-out infinite; }
@keyframes pulsa {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); }
  100% { box-shadow: 0 0 0 .55rem transparent; }
}
.pill {
  display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap;
  background: color-mix(in srgb, var(--c) var(--tint), transparent); color: var(--ink);
  padding: .2rem .65rem; border-radius: 999px; font-size: .85rem; font-weight: 600;
}

h2 { font-size: 1.2rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .9rem; }
.news, .group { margin-top: 2.75rem; }
.feed { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.feed li + li { border-top: 1px solid var(--line); }
.feed button {
  display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .8rem; align-items: baseline;
  width: 100%; text-align: left; background: none; border: 0; padding: .9rem 1.1rem; cursor: pointer;
}
.feed button:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.feed .dot { align-self: center; }
.feed strong { font-weight: 600; }
.feed time { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.feed p { grid-column: 2 / -1; margin: 0; color: var(--muted); font-size: .92rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; margin: 0; }

.tiles { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
.tile {
  display: flex; flex-direction: column; gap: .55rem; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem; min-height: 6.4rem; transition: border-color .15s, transform .15s;
}
.tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-1px); }
.tile:not([data-nivel="ok"]):not([data-nivel="espera"]) {
  border-color: color-mix(in srgb, var(--c) 45%, var(--line));
  background: linear-gradient(color-mix(in srgb, var(--c) 7%, var(--surface)), var(--surface) 70%);
}
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.tile-name { font-weight: 650; font-size: 1.02rem; }
.tile-note { margin: 0; color: var(--muted); font-size: .9rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* painel de detalhes */
dialog.panel {
  margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(34rem, 100vw); max-width: 100vw;
  border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink);
}
dialog.panel[open] { animation: entra .22s ease-out; }
dialog.panel::backdrop { background: rgb(10 14 22 / .45); backdrop-filter: blur(2px); }
@keyframes entra { from { transform: translateX(2rem); opacity: 0; } }
.panel-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 1.1rem 1.25rem; display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; z-index: 1; }
.panel-head h2 { margin: 0 0 .4rem; font-size: 1.4rem; }
.close { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; width: 2.2rem; height: 2.2rem;
  cursor: pointer; font-size: 1.2rem; line-height: 1; flex: none; }
.panel-body { padding: 1.25rem; }
.panel-body > p { margin: 0 0 1rem; }
.inc { border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
.inc h3 { margin: 0 0 .35rem; font-size: 1.05rem; font-weight: 650; }
.meta { color: var(--muted); font-size: .88rem; margin: 0 0 .75rem; }
.facts { display: grid; gap: .5rem; margin: 0 0 1rem; }
.fact { border-radius: 10px; padding: .6rem .8rem; background: color-mix(in srgb, var(--accent) 7%, transparent); }
.fact dt { font-size: .82rem; color: var(--muted); }
.fact dd { margin: 0; font-weight: 600; }
.inc h4 { font-size: .92rem; margin: 1rem 0 .5rem; }
.resumo { font-size: .93rem; margin: 0 0 .5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; padding: 0; margin: 0; }
.chips li { font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1rem; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 .9rem .25rem; }
.timeline li::before { content: ""; position: absolute; left: -1.38rem; top: .45rem; width: .6rem; height: .6rem;
  border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline time { color: var(--muted); font-size: .82rem; }
.timeline b { font-size: .82rem; text-transform: capitalize; margin-left: .35rem; }
.timeline p { margin: .2rem 0 0; font-size: .92rem; white-space: pre-line; overflow-wrap: anywhere; }
.orig { color: var(--muted); font-size: .82rem; margin-top: 1.25rem; }

.foot { margin-top: 3.5rem; color: var(--muted); font-size: .9rem; max-width: 70ch; }
.foot p { margin: .45rem 0; }

@media (max-width: 34rem) {
  .hero { padding: 2rem 0 1.5rem; }
  .strip { height: 2.1rem; gap: 2px; }
  .feed button { grid-template-columns: auto 1fr; }
  .feed time { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="https://sidneycavalcanti.com.br" data-t="marca"></a>
    <div class="tools">
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <h1 id="resumo" aria-live="polite"></h1>
    <p class="sub" id="quando"></p>
    <div class="strip" id="faixa"></div>
    <ul class="legend" id="legenda"></ul>
  </header>

  <section class="news" aria-labelledby="h-news">
    <h2 id="h-news" data-t="ultimas"></h2>
    <div id="feed"></div>
  </section>

  <main id="grupos"></main>

  <footer class="foot">
    <p data-t="rodape1"></p>
    <p data-t="rodape2"></p>
    <p data-t="rodape3"></p>
  </footer>
</div>

<dialog class="panel" id="painel" aria-labelledby="p-nome">
  <div class="panel-head">
    <div><h2 id="p-nome"></h2><span id="p-estado"></span></div>
    <button class="close" type="button" id="fechar">×</button>
  </div>
  <div class="panel-body" id="p-corpo"></div>
</dialog>

<script>
const DADOS = "https://raw.githubusercontent.com/sidneycavalcanti/sidneycavalcanti.github.io/dados/status.json";

const T = {
  pt: {
    locale: "pt-BR", titulo: "Status dos serviços", marca: "Sidney Cavalcanti, infraestrutura",
    grupos: { ms: "Microsoft e Google", nuvem: "Nuvem e rede", com: "Comunicação", trab: "Trabalho e desenvolvimento",
              ia: "Inteligência artificial", pag: "Pagamentos" },
    estado: { ok: "Operando", maint: "Em manutenção", minor: "Instável", major: "Falha parcial", critical: "Fora do ar",
              erro: "Sem resposta", espera: "Conferindo…" },
    conferindo: "Conferindo os serviços…",
    tudo: "Tudo operando.",
    nada: (n) => `Nada fora do ar. ${n === 1 ? "1 serviço instável" : `${n} serviços instáveis`}.`,
    falha: (nomes) => `${nomes} com falha agora.`,
    e: "e", mais: (n) => `e mais ${n}`,
    quando: (n, h) => `${n} serviços conferidos às ${h}. Atualiza sozinho a cada minuto.`,
    srvIdade: (m) => ` AWS, Azure e Microsoft 365 foram lidos ${m <= 1 ? "há 1 minuto" : `há ${m} minutos`}.`,
    ultimas: "Últimas atualizações oficiais",
    semNovidade: "Nenhum incidente aberto agora. As atualizações das empresas aparecem aqui assim que forem publicadas.",
    semIncidente: "Sem incidentes abertos",
    detalhes: "Ver detalhes",
    fechar: "Fechar",
    pagina: "Abrir a página oficial de status",
    okPainel: "Nenhum incidente aberto. O serviço está funcionando normalmente segundo a empresa.",
    erroPainel: "A página de status não respondeu. Abra a página oficial para conferir.",
    inicio: "Início", atualizado: "Última atualização",
    previsao: "Previsão de solução", proxima: "Próxima atualização prometida",
    fimManut: "Fim previsto da manutenção",
    semPrevisao: "A empresa ainda não deu previsão de solução.", dito: "informado em",
    afetados: "Afetados", impacto: "Impacto", historico: "Atualizações",
    orig: "Os textos dos incidentes são oficiais de cada empresa e ficam no idioma original.",
    rodape1: "Clique em um serviço para ver os detalhes, a previsão de solução e as atualizações oficiais.",
    rodape2: "AWS, Azure e Microsoft 365 não deixam o navegador ler o status direto, então um robô no GitHub busca esses três a cada 5 minutos (às vezes atrasa um pouco). Na AWS, só conta como falha grave o que afeta São Paulo, N. Virginia ou serviços globais.",
    rodape3: "Bancos tradicionais (Itaú, Bradesco, Banco do Brasil, Caixa) não publicam status em tempo real. Por isso aparecem os meios de pagamento que publicam.",
  },
  en: {
    locale: "en-US", titulo: "Service status", marca: "Sidney Cavalcanti, infrastructure",
    grupos: { ms: "Microsoft and Google", nuvem: "Cloud and network", com: "Communication", trab: "Work and development",
              ia: "Artificial intelligence", pag: "Payments" },
    estado: { ok: "Operational", maint: "Maintenance", minor: "Degraded", major: "Partial outage", critical: "Major outage",
              erro: "No response", espera: "Checking…" },
    conferindo: "Checking services…",
    tudo: "All systems operational.",
    nada: (n) => `Nothing is down. ${n === 1 ? "1 service degraded" : `${n} services degraded`}.`,
    falha: (nomes) => `${nomes} ${nomes.includes(" and ") || nomes.includes(",") ? "are" : "is"} having an outage.`,
    e: "and", mais: (n) => `and ${n} more`,
    quando: (n, h) => `${n} services checked at ${h}. Refreshes every minute.`,
    srvIdade: (m) => ` AWS, Azure and Microsoft 365 were read ${m <= 1 ? "1 minute ago" : `${m} minutes ago`}.`,
    ultimas: "Latest official updates",
    semNovidade: "No open incidents right now. Provider updates show up here as soon as they are posted.",
    semIncidente: "No open incidents",
    detalhes: "View details",
    fechar: "Close",
    pagina: "Open the official status page",
    okPainel: "No open incidents. The provider reports the service is working normally.",
    erroPainel: "The status page did not respond. Open the official page to check.",
    inicio: "Started", atualizado: "Last update",
    previsao: "Estimated resolution", proxima: "Next update promised",
    fimManut: "Scheduled end of maintenance",
    semPrevisao: "The provider has not given a resolution estimate yet.", dito: "stated",
    afetados: "Affected", impacto: "Impact", historico: "Updates",
    orig: "Incident texts come straight from each provider, in their original language.",
    rodape1: "Click a service to see details, the resolution estimate and official updates.",
    rodape2: "AWS, Azure and Microsoft 365 don't let browsers read their status directly, so a GitHub robot fetches those three every 5 minutes (it can run a little late). For AWS, only issues in São Paulo, N. Virginia or global services count as an outage.",
    rodape3: "Traditional Brazilian banks don't publish real-time status, so the page lists the payment providers that do.",
  },
};

// sp = Atlassian Statuspage (api/v2/summary.json, com CORS)
const sp = (nome, grupo, link, api = "/api/v2/summary.json") => ({ nome, grupo, link, tipo: "sp", url: link + api });
const FONTES = [
  { nome: "Microsoft 365", grupo: "ms", tipo: "srv", chave: "m365", link: "https://status.cloud.microsoft/" },
  { nome: "Azure", grupo: "ms", tipo: "srv", chave: "azure", link: "https://azure.status.microsoft/status" },
  { nome: "Google Workspace", grupo: "ms", tipo: "google", link: "https://www.google.com/appsstatus/dashboard/",
    url: "https://www.google.com/appsstatus/dashboard/incidents.json" },
  { nome: "Google Cloud", grupo: "ms", tipo: "google", link: "https://status.cloud.google.com/",
    url: "https://status.cloud.google.com/incidents.json" },
  { nome: "AWS", grupo: "nuvem", tipo: "srv", chave: "aws", link: "https://health.aws.amazon.com/health/status" },
  sp("Cloudflare", "nuvem", "https://www.cloudflarestatus.com"),
  sp("Oracle Cloud", "nuvem", "https://ocistatus.oraclecloud.com", "/api/v2/status.json"),
  { nome: "Slack", grupo: "com", tipo: "slack", link: "https://slack-status.com/",
    url: "https://slack-status.com/api/v2.0.0/current" },
  sp("Zoom", "com", "https://www.zoomstatus.com"),
  sp("Discord", "com", "https://discordstatus.com"),
  sp("Twilio", "com", "https://status.twilio.com"),
  sp("GitHub", "trab", "https://www.githubstatus.com"),
  sp("Jira e Confluence", "trab", "https://status.atlassian.com"),
  sp("Dropbox", "trab", "https://status.dropbox.com"),
  { nome: "Salesforce", grupo: "trab", tipo: "salesforce", link: "https://status.salesforce.com/",
    url: "https://api.status.salesforce.com/v1/incidents/active" },
  sp("ChatGPT e OpenAI", "ia", "https://status.openai.com"),
  sp("Claude", "ia", "https://status.claude.com"),
  sp("Mercado Pago", "pag", "https://status.mercadopago.com"),
  sp("PagBank", "pag", "https://status.pagbank.com.br"),
  sp("Cielo", "pag", "https://status.cielo.com.br"),
  sp("Pagar.me", "pag", "https://status.pagar.me"),
  sp("Efí", "pag", "https://status.sejaefi.com.br"),
  sp("Asaas", "pag", "https://status.asaas.com"),
];
const PESO = { erro: 0, espera: 0, ok: 0, maint: 1, minor: 2, major: 3, critical: 4 };
const limpa = (t) => String(t || "").replace(/\*\*/g, "").replace(/<[^>]+>/g, " ").replace(/[ \t]+/g, " ").trim();
const recentes = (us) => us.filter((u) => u.texto).sort((a, b) => (Date.parse(b.quando) || 0) - (Date.parse(a.quando) || 0));

// Cada leitor devolve { nivel, incidentes }, e cada incidente segue o formato do scripts/coletar.py:
// { titulo, status, inicio, atualizado, resumo, afetados, atualizacoes: [{quando, texto, status}], proxima, previsao, fimManut }
const LER = {
  sp(d) {
    const ind = (d.status && d.status.indicator) || "none";
    const manut = (d.scheduled_maintenances || []).filter((m) => m.status === "in_progress");
    const nivel = { none: "ok", minor: "minor", major: "major", critical: "critical", maintenance: "maint" }[ind] || "minor";
    const inc = (i, m) => ({
      titulo: i.name, status: i.status, inicio: i.started_at || i.scheduled_for || i.created_at, atualizado: i.updated_at,
      afetados: (i.components || []).map((c) => c.name), fimManut: m ? i.scheduled_until : null,
      atualizacoes: recentes((i.incident_updates || []).map((u) => ({ quando: u.display_at || u.created_at, texto: limpa(u.body), status: u.status }))),
    });
    return { nivel: nivel === "ok" && manut.length ? "maint" : nivel,
             incidentes: (d.incidents || []).map((i) => inc(i)).concat(manut.map((m) => inc(m, true))) };
  },
  google(d) {
    const abertos = d.filter((i) => !i.end);
    const sev = { low: "minor", medium: "major", high: "critical" };
    const nivel = abertos.reduce((p, i) => (PESO[sev[i.severity] || "minor"] > PESO[p] ? sev[i.severity] || "minor" : p), "ok");
    return { nivel, incidentes: abertos.map((i) => ({
      titulo: `${i.service_name}: ${limpa(i.external_desc).split("\n").find((l) => l.length > 3 && !/^summary:?$/i.test(l)) || ""}`.slice(0, 160),
      status: i.status_impact, inicio: i.begin, atualizado: i.modified,
      afetados: (i.affected_products || []).map((p) => p.title),
      atualizacoes: recentes((i.updates || []).map((u) => ({ quando: u.when || u.created, texto: limpa(u.text), status: u.status }))),
    })) };
  },
  slack(d) {
    const inc = d.active_incidents || [];
    if (d.status === "ok" || !inc.length) return { nivel: "ok", incidentes: [] };
    return { nivel: inc.some((i) => i.type === "outage") ? "major" : "minor", incidentes: inc.map((i) => ({
      titulo: i.title, status: i.status, inicio: i.date_created, atualizado: i.date_updated, afetados: i.services || [],
      atualizacoes: recentes((i.notes || []).map((n) => ({ quando: n.date_created, texto: limpa(n.body) }))),
    })) };
  },
  salesforce(d) {
    if (!d.length) return { nivel: "ok", incidentes: [] };
    return { nivel: d.some((i) => i.affectsAll || i.isCore) ? "major" : "minor", incidentes: d.map((i) => ({
      titulo: `${i.type || "Incident"}: ${(i.serviceKeys || []).join(", ") || "Salesforce"}`,
      status: i.status, inicio: i.createdAt, atualizado: i.updatedAt,
      afetados: [`${(i.instanceKeys || []).length} instances`],
      atualizacoes: recentes((i.IncidentEvents || []).map((e) => ({ quando: e.createdAt, texto: limpa(e.message), status: e.type }))),
    })) };
  },
};

// procura nas atualizacoes (mais nova primeiro) a previsao de solucao e a proxima atualizacao prometida
const RE_PROXIMA = [/(?:next|another|further) update(?: will be provided| expected)?\s*(?:by|at|in|within|on)?\s*:?\s*([^.\n]{3,80})/i,
                    /pr[óo]xima atualiza[çc][ãa]o[^:\n]*:?\s*([^.\n]{3,80})/i];
const RE_PREVISAO = [/(?:estimated time (?:to|of) (?:resolve|resolution|recovery)|estimated (?:resolution|completion)(?: time)?|\bETA\b|expected to (?:be )?(?:resolved|restored|complete[d]?) (?:by|at|within))\s*:?\s*([^.\n]{3,80})/i,
                     /previs[ãa]o(?: de (?:solu[çc][ãa]o|retorno|normaliza[çc][ãa]o|conclus[ãa]o))?\s*:?\s*([^.\n]{3,80})/i];
// devolve [texto, quando foi dito]; "em 4 horas" so faz sentido junto da hora da atualizacao
function achar(regras, inc) {
  for (const u of inc.atualizacoes || []) for (const r of regras) {
    const m = r.exec(u.texto || "");
    if (m) return [m[1].split(/\s+(?:or|ou)\s+/i)[0].trim(), u.quando];
  }
  return [null, null];
}
function normaliza(inc) {
  if (typeof inc === "string") inc = { titulo: inc };  // formato antigo do status.json
  inc.atualizacoes = inc.atualizacoes || [];
  inc.afetados = inc.afetados || [];
  if (!inc.proxima) [inc.proxima, inc.proximaDita] = achar(RE_PROXIMA, inc);
  if (!inc.previsao) [inc.previsao, inc.previsaoDita] = achar(RE_PREVISAO, inc);
  return inc;
}

async function json(url) {
  const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function conferir(srv) {
  return Promise.all(FONTES.map(async (f) => {
    let res;
    try {
      res = f.tipo === "srv" ? (srv && srv.servicos && srv.servicos[f.chave]) || { nivel: "erro", incidentes: [] }
                             : LER[f.tipo](await json(f.url));
    } catch (e) {
      res = { nivel: "erro", incidentes: [] };
    }
    return { ...f, nivel: res.nivel, incidentes: (res.incidentes || []).map(normaliza) };
  }));
}

function lista(nomes, t) {
  if (nomes.length < 2) return nomes[0] || "";
  return nomes.slice(0, -1).join(", ") + ` ${t.e} ` + nomes.at(-1);
}
// sempre ha algum incidente pequeno em algum lugar: o titulo nomeia so falha de verdade e conta o resto
function frase(servicos, t = T.pt) {
  const falhas = servicos.filter((s) => PESO[s.nivel] >= 3).sort((a, b) => PESO[b.nivel] - PESO[a.nivel]);
  const instaveis = servicos.filter((s) => s.nivel === "minor").length;
  if (falhas.length) {
    const nomes = falhas.slice(0, 3).map((s) => s.nome);
    const resto = falhas.length - nomes.length;
    return { nivel: falhas[0].nivel, texto: t.falha(resto ? `${nomes.join(", ")} ${t.mais(resto)}` : lista(nomes, t)) };
  }
  if (instaveis) return { nivel: "minor", texto: t.nada(instaveis) };
  return { nivel: "ok", texto: t.tudo };
}

/* ---------- interface ---------- */
let LANG = "pt", ATUAL = [], SRV = null, ABERTO = null;
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") n.addEventListener("click", v); else if (v != null) n.setAttribute(k, v);
  }
  n.append(...filhos.filter((f) => f != null && f !== false));
  return n;
}
const quando = (iso, estilo = "short") => {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString(T[LANG].locale, { dateStyle: estilo, timeStyle: "short" });
};
function relativo(iso) {
  const s = (Date.parse(iso) - Date.now()) / 1000;
  if (isNaN(s)) return "";
  const rtf = new Intl.RelativeTimeFormat(T[LANG].locale, { numeric: "auto" });
  for (const [u, n] of [["day", 86400], ["hour", 3600], ["minute", 60]]) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(Math.round(s), "second");
}
const pill = (nivel) => el("span", { class: "pill", "data-nivel": nivel }, el("span", { class: "dot" }), T[LANG].estado[nivel]);
const ordem = (a, b) => PESO[b.nivel] - PESO[a.nivel];

function desenhar() {
  const t = T[LANG];
  document.documentElement.lang = t.locale;
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t[n.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("fechar").setAttribute("aria-label", t.fechar);

  const carregando = ATUAL.every((s) => s.nivel === "espera");
  const r = frase(ATUAL, t);
  $("resumo").replaceChildren(carregando ? t.conferindo : r.texto);
  const falhas = ATUAL.filter((s) => PESO[s.nivel] >= 3).length;
  document.title = (falhas ? `(${falhas}) ` : "") + t.titulo;
  let sub = t.quando(ATUAL.length, new Date().toLocaleTimeString(t.locale, { hour: "2-digit", minute: "2-digit" }));
  if (SRV && SRV.gerado) sub += t.srvIdade(Math.round((Date.now() - Date.parse(SRV.gerado)) / 60000));
  $("quando").textContent = carregando ? "" : sub;

  // faixa e legenda
  const ordenados = [...ATUAL].sort(ordem);
  $("faixa").replaceChildren(...ordenados.map((s) =>
    el("button", { type: "button", "data-nivel": s.nivel, title: `${s.nome}: ${t.estado[s.nivel]}`,
                   "aria-label": `${s.nome}: ${t.estado[s.nivel]}`, on: () => abrir(s.nome) })));
  const contagem = {};
  ATUAL.forEach((s) => { contagem[s.nivel] = (contagem[s.nivel] || 0) + 1; });
  $("legenda").replaceChildren(...Object.keys(t.estado).filter((k) => contagem[k]).map((k) =>
    el("li", { "data-nivel": k }, el("span", { class: "dot" }), `${t.estado[k]}: ${contagem[k]}`)));

  // feed: a atualizacao mais recente de cada incidente aberto, de todos os servicos
  const itens = [];
  ATUAL.forEach((s) => s.incidentes.forEach((i) => {
    const u = i.atualizacoes[0];
    itens.push({ s, i, quando: (u && u.quando) || i.atualizado || i.inicio, texto: (u && u.texto) || i.resumo || i.titulo });
  }));
  itens.sort((a, b) => (Date.parse(b.quando) || 0) - (Date.parse(a.quando) || 0));
  $("feed").replaceChildren(itens.length
    ? el("ul", { class: "feed" }, ...itens.slice(0, 6).map((x) => el("li", {},
        el("button", { type: "button", "data-nivel": x.s.nivel, on: () => abrir(x.s.nome) },
          el("span", { class: "dot" }), el("strong", {}, `${x.s.nome}: ${x.i.titulo}`),
          el("time", { datetime: x.quando || "" }, relativo(x.quando)), el("p", {}, x.texto)))))
    : el("p", { class: "empty" }, carregando ? t.conferindo : t.semNovidade));

  // grupos de cartoes; quem tem problema vem primeiro
  $("grupos").replaceChildren(...Object.entries(t.grupos).map(([g, titulo]) =>
    el("section", { class: "group", "aria-labelledby": "g-" + g },
      el("h2", { id: "g-" + g }, titulo),
      el("div", { class: "tiles" }, ...ATUAL.filter((s) => s.grupo === g).sort(ordem).map((s) =>
        el("button", { type: "button", class: "tile", "data-nivel": s.nivel, "aria-label": `${s.nome}: ${t.estado[s.nivel]}. ${t.detalhes}`,
                       on: () => abrir(s.nome) },
          el("span", { class: "tile-top" }, el("span", { class: "tile-name" }, s.nome), pill(s.nivel)),
          el("p", { class: "tile-note" }, s.incidentes.length ? s.incidentes.map((i) => i.titulo).join(" · ") : t.semIncidente)))))));

  if (ABERTO) preencher(ABERTO);
}

function preencher(nome) {
  const t = T[LANG];
  const s = ATUAL.find((x) => x.nome === nome);
  if (!s) return;
  $("p-nome").textContent = s.nome;
  $("p-estado").replaceChildren(pill(s.nivel));
  const corpo = [el("p", {}, el("a", { href: s.link, target: "_blank", rel: "noopener" }, t.pagina))];
  if (!s.incidentes.length) corpo.push(el("p", {}, s.nivel === "erro" ? t.erroPainel : s.nivel === "espera" ? t.conferindo : t.okPainel));
  for (const i of s.incidentes) {
    const fatos = [];
    if (i.fimManut) fatos.push([t.fimManut, quando(i.fimManut, "medium")]);
    const dito = (q) => (q ? ` (${t.dito} ${quando(q)})` : "");
    fatos.push([t.previsao, i.previsao ? i.previsao + dito(i.previsaoDita) : t.semPrevisao]);
    if (i.proxima) fatos.push([t.proxima, i.proxima + dito(i.proximaDita)]);
    corpo.push(el("article", { class: "inc" },
      el("h3", {}, i.titulo),
      el("p", { class: "meta" }, [i.status, i.inicio && `${t.inicio}: ${quando(i.inicio)}`,
        i.atualizado && `${t.atualizado}: ${relativo(i.atualizado)}`].filter(Boolean).join("  |  ")),
      el("dl", { class: "facts" }, ...fatos.map(([k, v]) => el("div", { class: "fact" }, el("dt", {}, k), el("dd", {}, v)))),
      i.resumo && el("h4", {}, t.impacto), i.resumo && el("p", { class: "resumo" }, i.resumo),
      i.afetados.length > 0 && el("h4", {}, t.afetados),
      i.afetados.length > 0 && el("ul", { class: "chips" }, ...i.afetados.slice(0, 24).map((a) => el("li", {}, a))),
      i.atualizacoes.length > 0 && el("h4", {}, t.historico),
      i.atualizacoes.length > 0 && el("ol", { class: "timeline" }, ...i.atualizacoes.slice(0, 12).map((u) => el("li", {},
        el("time", { datetime: u.quando || "" }, u.quando ? quando(u.quando) : ""), u.status && el("b", {}, u.status),
        el("p", {}, u.texto))))));
  }
  if (s.incidentes.length) corpo.push(el("p", { class: "orig" }, t.orig));
  $("p-corpo").replaceChildren(...corpo);
}

function abrir(nome) {
  ABERTO = nome;
  history.replaceState(null, "", "#" + encodeURIComponent(nome));  // link direto para o painel
  preencher(nome);
  const d = $("painel");
  if (!d.open) d.showModal();
  $("p-corpo").scrollTop = 0;
}

async function ciclo() {
  SRV = await json(DADOS + "?t=" + Date.now()).catch(() => null);
  ATUAL = await conferir(SRV);
  desenhar();
}

if (typeof document !== "undefined") {
  try { LANG = localStorage.getItem("lang") || ""; } catch (e) { LANG = ""; }
  if (!T[LANG]) LANG = (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    try { localStorage.setItem("lang", LANG); } catch (e) {}
    desenhar();
  }));
  const d = $("painel");
  $("fechar").addEventListener("click", () => d.close());
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });  // clique fora fecha
  d.addEventListener("close", () => { ABERTO = null; history.replaceState(null, "", location.pathname); });
  ATUAL = FONTES.map((f) => ({ ...f, nivel: "espera", incidentes: [] }));
  desenhar();
  const alvo = decodeURIComponent(location.hash.slice(1));
  ciclo().then(() => { if (alvo && ATUAL.some((s) => s.nome === alvo)) abrir(alvo); });
  setInterval(ciclo, 60000);
}
</script>
