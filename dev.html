<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status dos serviços</title>
<meta name="description" content="Status em tempo real dos serviços de que as empresas dependem: Microsoft 365, Google, AWS, pagamentos e mais.">
<meta name="theme-color" content="#221d5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23221d5c'/%3E%3Crect x='12' y='34' width='9' height='16' rx='3' fill='%230ca30c'/%3E%3Crect x='27' y='24' width='9' height='26' rx='3' fill='%23fab219'/%3E%3Crect x='42' y='14' width='9' height='36' rx='3' fill='%23ec835a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f9;
  --surface: #ffffff;
  --line: #e1e5ee;
  --ink: #161b2e;
  --muted: #5d677c;
  --accent: #5145d6;
  --band: #221d5c;          /* faixa do topo */
  --band-2: #2f2878;
  --band-ink: #f2f1ff;
  --band-muted: #c5c1f2;
  /* paleta de status (fixa, da skill de dataviz) + manutencao e sem resposta */
  --ok: #0ca30c;
  --minor: #fab219;
  --major: #ec835a;
  --critical: #d03b3b;
  --maint: #2a78d6;
  --off: #9aa3b2;
  --seq: #2a78d6;           /* grafico de atividade: um tom so */
  --tint: 14%;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1220; --surface: #171b2b; --line: #272d42; --ink: #e9ecf5; --muted: #9ba4b8;
    --accent: #9a92ff; --band: #19163f; --band-2: #241f58; --maint: #3987e5; --seq: #3987e5; --off: #6b7385; --tint: 20%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 "Geist", system-ui, sans-serif; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 74rem; margin: 0 auto; padding: 0 1rem; }

[data-nivel="ok"] { --c: var(--ok); --ic: "✓"; }
[data-nivel="maint"] { --c: var(--maint); --ic: "⚙"; }
[data-nivel="minor"] { --c: var(--minor); --ic: "!"; }
[data-nivel="major"] { --c: var(--major); --ic: "▲"; }
[data-nivel="critical"] { --c: var(--critical); --ic: "✕"; }
[data-nivel="erro"], [data-nivel="espera"] { --c: var(--off); --ic: "?"; }
/* icone redondo com o simbolo do estado: a cor nunca fala sozinha */
.ico { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: var(--c); color: #fff; font-size: .72rem; font-weight: 700; flex: none; line-height: 1; }
.ico::before { content: var(--ic); }
[data-nivel="minor"] .ico, [data-nivel="minor"].ico { color: #3a2a00; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- topo ---------- */
.band { background: radial-gradient(60rem 30rem at 85% -10%, var(--band-2), transparent 70%), var(--band); color: var(--band-ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 0; }
.brand { color: var(--band-muted); text-decoration: none; font-weight: 500; }
.brand:hover { color: var(--band-ink); }
.seg { display: inline-flex; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .16); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: .3rem .8rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--band-muted); }
.seg button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); }
.hero { padding: 2.2rem 0 2.6rem; }
h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); font-weight: 700; line-height: 1.04; letter-spacing: -.035em; margin: 0 0 .6rem; }
.intro { color: var(--band-muted); margin: 0 0 1.6rem; max-width: 60ch; }
.banner {
  display: flex; align-items: center; gap: .8rem; padding: .95rem 1.1rem; border-radius: 14px;
  background: var(--c); color: #fff; font-weight: 650; font-size: 1.08rem;
}
.banner[data-nivel="minor"] { color: #2b2000; }
.banner .ico { background: rgb(255 255 255 / .92); color: var(--c); width: 1.6rem; height: 1.6rem; font-size: .9rem; }
.banner small { display: block; font-weight: 400; font-size: .88rem; opacity: .9; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-top: .9rem; }
.kpi { background: rgb(255 255 255 / .07); border: 1px solid rgb(255 255 255 / .13); border-radius: 14px; padding: .9rem 1rem; }
.kpi b { display: block; font-size: 2.1rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi span { display: flex; align-items: center; gap: .45rem; color: var(--band-muted); font-size: .9rem; }

/* ---------- cartoes e graficos ---------- */
main.wrap { padding-top: 2.4rem; }
h2 { font-size: 1.2rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .9rem; }
main section + section, #grupos > section { margin-top: 2.6rem; }
.foot { margin-top: 3.5rem; }
.charts { display: grid; gap: .9rem; grid-template-columns: 1fr 1fr; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem 1.2rem; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 1rem; font-weight: 650; margin: 0 0 .15rem; }
.card .note { color: var(--muted); font-size: .88rem; margin: 0 0 1rem; }
.legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin: .9rem 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .86rem; }
.legend li { display: flex; align-items: center; gap: .4rem; }

/* barra segmentada (o todo) e barras empilhadas (cada grupo): 2px de folga, pontas arredondadas */
.stack { display: flex; gap: 2px; height: 2.4rem; }
.stack.tall { height: 3.4rem; }
.stack > button { min-width: 6px; border: 0; padding: 0 .55rem; background: var(--c); cursor: pointer; border-radius: 0;
  display: flex; align-items: center; justify-content: flex-start; overflow: hidden; color: #fff; font-weight: 700; font-size: .95rem; }
.stack > button[data-nivel="minor"] { color: #2b2000; }
.stack > button:first-child { border-radius: 4px 0 0 4px; }
.stack > button:last-child { border-radius: 0 4px 4px 0; }
.stack > button:only-child { border-radius: 4px; }
.stack > button:hover { filter: brightness(1.08); }
.rows { display: grid; gap: .6rem; }
.row { display: grid; grid-template-columns: 11.5rem 1fr 2.4rem; gap: .2rem .8rem; align-items: center; }
.rows .lbl { font-size: .9rem; }
.rows .num { color: var(--muted); font-size: .85rem; text-align: right; }
.rows .stack { height: 1.35rem; }
.rows .stack > button { font-size: 0; }

/* colunas da atividade */
.cols { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 9rem;
  border-bottom: 1px solid var(--line); background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 50%; }
.cols > button { height: 100%; border: 0; padding: 0; background: none; cursor: pointer; display: flex; align-items: flex-end; }
.cols > button i { display: block; width: 100%; background: var(--seq); border-radius: 4px 4px 0 0; min-height: 0; }
.cols > button:hover i { filter: brightness(1.15); }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-top: .35rem; }
.ymax { color: var(--muted); font-size: .8rem; margin: -.4rem 0 .3rem; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); padding: .45rem .65rem;
  border-radius: 8px; font-size: .85rem; max-width: 18rem; box-shadow: 0 6px 20px rgb(0 0 0 / .2); opacity: 0; transition: opacity .1s; }
#tip.on { opacity: 1; }

/* ---------- feed e servicos ---------- */
.feed { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.feed li + li { border-top: 1px solid var(--line); }
.feed button { display: grid; grid-template-columns: auto 1fr auto; gap: .25rem .8rem; align-items: start; width: 100%;
  text-align: left; background: none; border: 0; padding: .95rem 1.15rem; cursor: pointer; }
.feed button:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.feed strong { font-weight: 600; }
.feed time { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.feed p { grid-column: 2 / -1; margin: 0; color: var(--muted); font-size: .92rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; margin: 0; }

.tiles { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
.tile { position: relative; display: flex; flex-direction: column; gap: .55rem; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem 1rem 1.3rem;
  min-height: 6.4rem; overflow: hidden; transition: border-color .15s, transform .15s; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-1px); }
.tile:not([data-nivel="ok"]):not([data-nivel="espera"]) { background: linear-gradient(100deg, color-mix(in srgb, var(--c) 10%, var(--surface)), var(--surface) 65%); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.tile-name { font-weight: 650; font-size: 1.02rem; }
.tile-note { margin: 0; color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; background: color-mix(in srgb, var(--c) var(--tint), transparent);
  padding: .18rem .6rem .18rem .25rem; border-radius: 999px; font-size: .84rem; font-weight: 600; }
.pill .ico { width: 1.1rem; height: 1.1rem; font-size: .65rem; }

/* ---------- painel de detalhes ---------- */
dialog.panel { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(34rem, 100vw); max-width: 100vw;
  border: 0; padding: 0; background: var(--surface); color: var(--ink); }
dialog.panel[open] { animation: entra .22s ease-out; }
dialog.panel::backdrop { background: rgb(10 12 28 / .5); backdrop-filter: blur(2px); }
@keyframes entra { from { transform: translateX(2rem); opacity: 0; } }
.panel-head { position: sticky; top: 0; z-index: 1; padding: 1.1rem 1.25rem; display: flex; gap: 1rem; align-items: flex-start;
  justify-content: space-between; background: var(--c); color: #fff; }
.panel-head[data-nivel="minor"] { color: #2b2000; }
.panel-head h2 { margin: 0 0 .2rem; font-size: 1.45rem; }
.panel-head p { margin: 0; font-weight: 600; }
.close { border: 0; background: rgb(255 255 255 / .9); color: #161b2e; border-radius: 999px; width: 2.2rem; height: 2.2rem; cursor: pointer; font-size: 1.2rem; line-height: 1; flex: none; }
.panel-body { padding: 1.25rem; }
.panel-body > p { margin: 0 0 1rem; }
.inc { border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
.inc h3 { margin: 0 0 .35rem; font-size: 1.05rem; font-weight: 650; }
.meta { color: var(--muted); font-size: .88rem; margin: 0 0 .75rem; }
.facts { display: grid; gap: .5rem; margin: 0 0 1rem; }
.fact { border-radius: 10px; padding: .6rem .8rem; background: color-mix(in srgb, var(--accent) 8%, transparent); }
.fact dt { font-size: .82rem; color: var(--muted); }
.fact dd { margin: 0; font-weight: 600; }
.inc h4 { font-size: .92rem; margin: 1rem 0 .5rem; }
.resumo { font-size: .93rem; margin: 0 0 .5rem; white-space: pre-line; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; padding: 0; margin: 0; }
.chips li { font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1rem; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 .9rem .25rem; }
.timeline li::before { content: ""; position: absolute; left: -1.38rem; top: .45rem; width: .6rem; height: .6rem; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline time { color: var(--muted); font-size: .82rem; }
.timeline b { font-size: .82rem; text-transform: capitalize; margin-left: .35rem; }
.timeline p { margin: .2rem 0 0; font-size: .92rem; white-space: pre-line; overflow-wrap: anywhere; }
.orig { color: var(--muted); font-size: .82rem; margin-top: 1.25rem; }

.foot { color: var(--muted); font-size: .9rem; max-width: 70ch; padding-bottom: 3rem; }
.foot p { margin: .45rem 0; }

@media (max-width: 52rem) { .charts { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } }
@media (max-width: 34rem) {
  .feed button { grid-template-columns: auto 1fr; }
  .feed time { grid-column: 2; }
  .row { grid-template-columns: 1fr auto; }
  .row .stack { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="https://sidneycavalcanti.com.br" data-t="marca"></a>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <header class="hero">
      <h1 data-t="titulo"></h1>
      <p class="intro" id="intro"></p>
      <div class="banner" id="banner" aria-live="polite"></div>
      <div class="kpis" id="kpis"></div>
    </header>
  </div>
</div>

<main class="wrap">
  <section aria-labelledby="h-visao">
    <h2 id="h-visao" data-t="visao"></h2>
    <div class="charts">
      <div class="card wide">
        <h3 data-t="gTodos"></h3>
        <p class="note" data-t="gTodosNota"></p>
        <div class="stack tall" id="g-todos"></div>
        <ul class="legend" id="g-legenda"></ul>
      </div>
      <div class="card">
        <h3 data-t="gGrupos"></h3>
        <p class="note" data-t="gGruposNota"></p>
        <div class="rows" id="g-grupos"></div>
      </div>
      <div class="card">
        <h3 data-t="gAtiv"></h3>
        <p class="note" id="g-ativ-nota"></p>
        <p class="ymax" id="g-ymax"></p>
        <div class="cols" id="g-ativ"></div>
        <div class="axis" id="g-eixo"></div>
      </div>
    </div>
  </section>

  <section aria-labelledby="h-news">
    <h2 id="h-news" data-t="ultimas"></h2>
    <div id="feed"></div>
  </section>

  <div id="grupos"></div>

  <footer class="foot">
    <p data-t="rodape1"></p>
    <p data-t="rodape2"></p>
    <p data-t="rodape3"></p>
  </footer>
</main>

<div id="tip" role="tooltip"></div>

<dialog class="panel" id="painel" aria-labelledby="p-nome">
  <div class="panel-head" id="p-head">
    <div><h2 id="p-nome"></h2><p id="p-estado"></p></div>
    <button class="close" type="button" id="fechar">×</button>
  </div>
  <div class="panel-body" id="p-corpo"></div>
</dialog>

// sp = Atlassian Statuspage (api/v2/summary.json, com CORS)
const sp = (nome, grupo, link, api = "/api/v2/summary.json") => ({ nome, grupo, link, tipo: "sp", url: link + api });
const FONTES = [
  { nome: "Microsoft 365", grupo: "ms", tipo: "srv", chave: "m365", link: "https://status.cloud.microsoft/" },
  { nome: "Azure", grupo: "ms", tipo: "srv", chave: "azure", link: "https://azure.status.microsoft/status" },
  { nome: "Google Workspace", grupo: "ms", tipo: "google", link: "https://www.google.com/appsstatus/dashboard/",
    url: "https://www.google.com/appsstatus/dashboard/incidents.json" },
  { nome: "Google Cloud", grupo: "ms", tipo: "google", link: "https://status.cloud.google.com/",
    url: "https://status.cloud.google.com/incidents.json" },
  { nome: "AWS", grupo: "nuvem", tipo: "srv", chave: "aws", link: "https://health.aws.amazon.com/health/status" },
  sp("Cloudflare", "nuvem", "https://www.cloudflarestatus.com"),
  sp("Oracle Cloud", "nuvem", "https://ocistatus.oraclecloud.com", "/api/v2/status.json"),

    url: "https://api.status.salesforce.com/v1/incidents/active" },
  sp("ChatGPT e OpenAI", "ia", "https://status.openai.com"),

  sp("Asaas", "pag", "https://status.asaas.com"),

const NIVEIS = ["critical", "major", "minor", "maint", "ok", "erro"];  // ordem fixa nos graficos
const PESO = { erro: 0, espera: 0, ok: 0, maint: 1, minor: 2, major: 3, critical: 4 };
const limpa = (t) => String(t || "").replace(/\*\*/g, "").replace(/<[^>]+>/g, " ").replace(/[ \t]+/g, " ").trim();
const recentes = (us) => us.filter((u) => u.texto).sort((a, b) => (Date.parse(b.quando) || 0) - (Date.parse(a.quando) || 0));

// Cada leitor devolve { nivel, incidentes }, e cada incidente segue o formato do scripts/coletar.py:
// { titulo, status, inicio, atualizado, resumo, afetados, atualizacoes: [{quando, texto, status}], proxima, previsao, fimManut }
const LER = {
  sp(d) {
    const ind = (d.status && d.status.indicator) || "none";
    const manut = (d.scheduled_maintenances || []).filter((m) => m.status === "in_progress");
    const nivel = { none: "ok", minor: "minor", major: "major", critical: "critical", maintenance: "maint" }[ind] || "minor";
    const inc = (i, m) => ({
      titulo: i.name, status: i.status, inicio: i.started_at || i.scheduled_for || i.created_at, atualizado: i.updated_at,
      afetados: (i.components || []).map((c) => c.name), fimManut: m ? i.scheduled_until : null,
      atualizacoes: recentes((i.incident_updates || []).map((u) => ({ quando: u.display_at || u.created_at, texto: limpa(u.body), status: u.status }))),
    });
    return { nivel: nivel === "ok" && manut.length ? "maint" : nivel,
             incidentes: (d.incidents || []).map((i) => inc(i)).concat(manut.map((m) => inc(m, true))) };
  },
  google(d) {
    const abertos = d.filter((i) => !i.end);
    const sev = { low: "minor", medium: "major", high: "critical" };
    const nivel = abertos.reduce((p, i) => (PESO[sev[i.severity] || "minor"] > PESO[p] ? sev[i.severity] || "minor" : p), "ok");
    return { nivel, incidentes: abertos.map((i) => ({
      titulo: `${i.service_name}: ${limpa(i.external_desc).split("\n").find((l) => l.length > 3 && !/^summary:?$/i.test(l)) || ""}`.slice(0, 160),
      status: i.status_impact, inicio: i.begin, atualizado: i.modified,
      afetados: (i.affected_products || []).map((p) => p.title),
      atualizacoes: recentes((i.updates || []).map((u) => ({ quando: u.when || u.created, texto: limpa(u.text), status: u.status }))),
    })) };
  },
  slack(d) {
    const inc = d.active_incidents || [];
    if (d.status === "ok" || !inc.length) return { nivel: "ok", incidentes: [] };
    return { nivel: inc.some((i) => i.type === "outage") ? "major" : "minor", incidentes: inc.map((i) => ({
      titulo: i.title, status: i.status, inicio: i.date_created, atualizado: i.date_updated, afetados: i.services || [],
      atualizacoes: recentes((i.notes || []).map((n) => ({ quando: n.date_created, texto: limpa(n.body) }))),
    })) };
  },
  salesforce(d) {
    if (!d.length) return { nivel: "ok", incidentes: [] };
    return { nivel: d.some((i) => i.affectsAll || i.isCore) ? "major" : "minor", incidentes: d.map((i) => ({
      titulo: `${i.type || "Incident"}: ${(i.serviceKeys || []).join(", ") || "Salesforce"}`,
      status: i.status, inicio: i.createdAt, atualizado: i.updatedAt,
      afetados: [`${(i.instanceKeys || []).length} instances`],
      atualizacoes: recentes((i.IncidentEvents || []).map((e) => ({ quando: e.createdAt, texto: limpa(e.message), status: e.type }))),
    })) };
  },
};

// procura nas atualizacoes (mais nova primeiro) a previsao de solucao e a proxima atualizacao prometida
const RE_PROXIMA = [/(?:next|another|further) update(?: will be provided| expected)?\s*(?:by|at|in|within|on)?\s*:?\s*([^.\n]{3,80})/i,
                    /pr[óo]xima atualiza[çc][ãa]o[^:\n]*:?\s*([^.\n]{3,80})/i];
const RE_PREVISAO = [/(?:estimated time (?:to|of) (?:resolve|resolution|recovery)|estimated (?:resolution|completion)(?: time)?|\bETA\b|expected to (?:be )?(?:resolved|restored|complete[d]?) (?:by|at|within))\s*:?\s*([^.\n]{3,80})/i,
                     /previs[ãa]o(?: de (?:solu[çc][ãa]o|retorno|normaliza[çc][ãa]o|conclus[ãa]o))?\s*:?\s*([^.\n]{3,80})/i];
// devolve [texto, quando foi dito]; "em 4 horas" so faz sentido junto da hora da atualizacao
function achar(regras, inc) {
  for (const u of inc.atualizacoes || []) for (const r of regras) {
    const m = r.exec(u.texto || "");
    if (m) return [m[1].split(/\s+(?:or|ou)\s+/i)[0].trim(), u.quando];
  }
  return [null, null];
}
function normaliza(inc) {
  if (typeof inc === "string") inc = { titulo: inc };  // formato antigo do status.json
  inc.atualizacoes = inc.atualizacoes || [];
  inc.afetados = inc.afetados || [];
  if (!inc.proxima) [inc.proxima, inc.proximaDita] = achar(RE_PROXIMA, inc);
  if (!inc.previsao) [inc.previsao, inc.previsaoDita] = achar(RE_PREVISAO, inc);
  return inc;
}

async function json(url) {
  const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function conferir(srv) {
  return Promise.all(FONTES.map(async (f) => {
    let res;
    try {
      res = f.tipo === "srv" ? (srv && srv.servicos && srv.servicos[f.chave]) || { nivel: "erro", incidentes: [] }
                             : LER[f.tipo](await json(f.url));
    } catch (e) {
      res = { nivel: "erro", incidentes: [] };
    }
    return { ...f, nivel: res.nivel, incidentes: (res.incidentes || []).map(normaliza) };
  }));
}

function lista(nomes, t) {
  if (nomes.length < 2) return nomes[0] || "";
  return nomes.slice(0, -1).join(", ") + ` ${t.e} ` + nomes.at(-1);
}
// sempre ha algum incidente pequeno em algum lugar: a faixa nomeia so falha de verdade e conta o resto
function frase(servicos, t = T.pt) {
  const falhas = servicos.filter((s) => PESO[s.nivel] >= 3).sort((a, b) => PESO[b.nivel] - PESO[a.nivel]);
  const instaveis = servicos.filter((s) => s.nivel === "minor").length;
  if (falhas.length) {
    const nomes = falhas.slice(0, 3).map((s) => s.nome);
    const resto = falhas.length - nomes.length;
    return { nivel: falhas[0].nivel, texto: t.falha(resto ? `${nomes.join(", ")} ${t.mais(resto)}` : lista(nomes, t)) };
  }
  if (instaveis) return { nivel: "minor", texto: t.nada(instaveis) };
  return { nivel: "ok", texto: t.tudo };
}

// atualizacoes por hora cheia nas ultimas 24 h (indice 23 = hora atual), igual aos rotulos do grafico
function atividade(servicos, agora = Date.now()) {
  const horas = new Array(24).fill(0);
  const base = Math.floor(agora / 3600000);
  servicos.forEach((s) => s.incidentes.forEach((i) => i.atualizacoes.forEach((u) => {
    const h = base - Math.floor(Date.parse(u.quando) / 3600000);
    if (h >= 0 && h < 24) horas[23 - h]++;
  })));
  return horas;
}

/* ---------- traducao: textos das empresas, no idioma escolhido ---------- */
// ponytail: endpoint publico do Google Tradutor (sem chave); se falhar, fica o texto original
const CACHE_TR = new Map();
// nomes de produto saem do texto antes de traduzir (senao "Exchange" vira "Intercambio", "Teams" vira "Equipes")
const PRODUTOS = /Microsoft (?:Teams|Planner|To Do|Intune|Purview|Copilot(?: 365)?|Defender(?: XDR| for Office 365)?|Entra ID|365)|Exchange Online|SharePoint Online|Google (?:Workspace|Meet|Drive|Chat|Cloud)|Universal Print|Durable Objects|Power BI|Entra ID|OneDrive|SharePoint|Exchange|Outlook|Teams|Planner|Intune|Purview|Copilot|Defender|Workers|Gmail/g;
function protege(texto) {
  const termos = [];
  return { s: texto.replace(PRODUTOS, (m) => `⟦${termos.push(m) - 1}⟧`), termos };
}
const devolve = (s, termos) => s.replace(/⟦\s*(\d+)\s*⟧/g, (m, i) => termos[i] ?? m);
function traduzir(texto, alvo) {
  const k = alvo + "|" + texto;
  if (!CACHE_TR.has(k)) {
    const { s, termos } = protege(texto.slice(0, 1800));
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl=" + alvo + "&q=" + encodeURIComponent(s);
    CACHE_TR.set(k, fetch(url).then((r) => r.json())
      .then((d) => (d[2] === alvo ? null : devolve(d[0].map((p) => p[0]).join(""), termos))).catch(() => null));
  }
  return CACHE_TR.get(k);
}
// cria o elemento com o texto original e troca pela traducao quando ela chegar
function tx(tag, attrs, texto) {
  const n = el(tag, attrs, texto || "");
  if (texto && typeof document !== "undefined") {
    const alvo = T[LANG].lang;
    traduzir(texto, alvo).then((tr) => { if (tr && T[LANG].lang === alvo) { n.textContent = tr; n.title = texto; } });
  }
  return n;
}

/* ---------- interface ---------- */
let LANG = "pt", ATUAL = [], SRV = null, ABERTO = null;
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") n.addEventListener("click", v);
    else if (k === "tip") { n.addEventListener("mouseenter", (e) => dica(v, e)); n.addEventListener("mousemove", (e) => dica(v, e));
      n.addEventListener("mouseleave", () => dica()); n.addEventListener("focus", (e) => dica(v, e)); n.addEventListener("blur", () => dica()); }
    else if (v != null) n.setAttribute(k, v);
  }
  n.append(...filhos.filter((f) => f != null && f !== false));
  return n;
}
function dica(texto, e) {
  const d = $("tip");
  if (!texto) { d.classList.remove("on"); return; }
  d.textContent = texto;
  d.classList.add("on");
  const r = e.type === "focus" ? e.target.getBoundingClientRect() : { left: e.clientX, top: e.clientY, bottom: e.clientY };
  const x = Math.min(r.left + 12, innerWidth - d.offsetWidth - 8);
  const y = r.top - d.offsetHeight - 10 < 4 ? r.bottom + 14 : r.top - d.offsetHeight - 10;
  d.style.left = x + "px"; d.style.top = y + "px";
}
const quando = (iso, estilo = "short") => {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString(T[LANG].locale, { dateStyle: estilo, timeStyle: "short" });
};
const hora = (d) => d.toLocaleTimeString(T[LANG].locale, { hour: "2-digit", minute: "2-digit" });
function relativo(iso) {
  const s = (Date.parse(iso) - Date.now()) / 1000;
  if (isNaN(s)) return "";
  const rtf = new Intl.RelativeTimeFormat(T[LANG].locale, { numeric: "auto" });
  for (const [u, n] of [["day", 86400], ["hour", 3600], ["minute", 60]]) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(Math.round(s), "second");
}
const ico = (nivel) => el("span", { class: "ico", "data-nivel": nivel, "aria-hidden": "true" });
const pill = (nivel) => el("span", { class: "pill", "data-nivel": nivel }, ico(nivel), T[LANG].estado[nivel]);
const ordem = (a, b) => PESO[b.nivel] - PESO[a.nivel];

// barra empilhada: um segmento por estado, largura proporcional
function pilha(servicos, comRotulo) {
  const t = T[LANG];
  return NIVEIS.filter((k) => servicos.some((s) => s.nivel === k)).map((k) => {
    const doEstado = servicos.filter((s) => s.nivel === k);
    const txt = `${t.estado[k]}: ${doEstado.length}. ${doEstado.map((s) => s.nome).join(", ")}`;
    return el("button", { type: "button", "data-nivel": k, style: `flex:${doEstado.length}`, "aria-label": txt, tip: txt,
                          on: () => abrir(doEstado[0].nome) }, comRotulo ? String(doEstado.length) : "");
  });
}

function desenhar() {
  const t = T[LANG];
  document.documentElement.lang = t.locale;
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t[n.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("fechar").setAttribute("aria-label", t.fechar);
  const carregando = ATUAL.every((s) => s.nivel === "espera");
  const conta = (f) => ATUAL.filter(f).length;
  const falhas = conta((s) => PESO[s.nivel] >= 3);
  document.title = (falhas ? `(${falhas}) ` : "") + t.titulo;

  // topo: faixa de status e indicadores
  $("intro").textContent = t.intro(ATUAL.length);
  const r = carregando ? { nivel: "espera", texto: t.conferindo } : frase(ATUAL, t);
  let sub = carregando ? "" : t.quando(hora(new Date()));
  if (!carregando && SRV && SRV.gerado) sub += t.srvIdade(Math.round((Date.now() - Date.parse(SRV.gerado)) / 60000));
  const b = $("banner");
  b.dataset.nivel = r.nivel;
  b.replaceChildren(ico(r.nivel), el("div", {}, r.texto, el("small", {}, sub)));
  const incAbertos = ATUAL.reduce((n, s) => n + s.incidentes.length, 0);
  $("kpis").replaceChildren(...[
    ["ok", conta((s) => s.nivel === "ok" || s.nivel === "maint"), t.kOk],
    ["minor", conta((s) => s.nivel === "minor"), t.kInst],
    ["major", falhas, t.kFalha],
    [null, incAbertos, t.kInc],
  ].map(([k, n, rot]) => el("div", { class: "kpi" }, el("b", {}, carregando ? "–" : String(n)),
    el("span", {}, k ? ico(k) : null, rot))));

  // graficos
  $("g-todos").replaceChildren(...pilha(ATUAL, true));
  const presentes = NIVEIS.filter((k) => ATUAL.some((s) => s.nivel === k));
  $("g-legenda").replaceChildren(...presentes.map((k) => el("li", { "data-nivel": k }, ico(k), `${t.estado[k]} (${conta((s) => s.nivel === k)})`)));
  $("g-grupos").replaceChildren(...Object.entries(t.grupos).map(([g, nome]) => {
    const doGrupo = ATUAL.filter((s) => s.grupo === g);
    const ruins = doGrupo.filter((s) => PESO[s.nivel] >= 2).length;
    return el("div", { class: "row" }, el("span", { class: "lbl" }, nome), el("div", { class: "stack" }, ...pilha(doGrupo, false)),
              el("span", { class: "num" }, `${doGrupo.length - ruins}/${doGrupo.length}`));
  }));
  const horas = atividade(ATUAL);
  const max = Math.max(1, ...horas);
  const agora = new Date();
  $("g-ativ-nota").textContent = t.ativNota(horas.reduce((a, b) => a + b, 0));
  $("g-ymax").textContent = String(max);
  $("g-ativ").replaceChildren(...horas.map((n, i) => {
    const ini = new Date(agora - (23 - i) * 3600000);
    ini.setMinutes(0, 0, 0);
    const txt = t.ativTip(hora(ini), hora(new Date(+ini + 3600000)), n);
    return el("button", { type: "button", "aria-label": txt, tip: txt }, el("i", { style: `height:${(n / max) * 100}%` }));
  }));
  $("g-eixo").replaceChildren(el("span", {}, t.h24), el("span", {}, "12 h"), el("span", {}, t.agora));

  // feed: a atualizacao mais recente de cada incidente aberto, de todos os servicos
  const itens = [];
  ATUAL.forEach((s) => s.incidentes.forEach((i) => {
    const u = i.atualizacoes[0];
    itens.push({ s, i, quando: (u && u.quando) || i.atualizado || i.inicio, texto: (u && u.texto) || i.resumo || i.titulo });
  }));
  itens.sort((a, b) => (Date.parse(b.quando) || 0) - (Date.parse(a.quando) || 0));
  $("feed").replaceChildren(itens.length
    ? el("ul", { class: "feed" }, ...itens.slice(0, 6).map((x) => el("li", {},
        el("button", { type: "button", on: () => abrir(x.s.nome) },
          ico(x.s.nivel), el("strong", {}, `${x.s.nome}: `, tx("span", {}, x.i.titulo)),
          el("time", { datetime: x.quando || "" }, relativo(x.quando)), tx("p", {}, x.texto)))))
    : el("p", { class: "empty" }, carregando ? t.conferindo : t.semNovidade));

  // servicos por area; quem tem problema vem primeiro
  $("grupos").replaceChildren(...Object.entries(t.grupos).map(([g, titulo]) =>
    el("section", { "aria-labelledby": "g-" + g },
      el("h2", { id: "g-" + g }, titulo),
      el("div", { class: "tiles" }, ...ATUAL.filter((s) => s.grupo === g).sort(ordem).map((s) =>
        el("button", { type: "button", class: "tile", "data-nivel": s.nivel, "aria-label": `${s.nome}: ${t.estado[s.nivel]}. ${t.detalhes}`,
                       on: () => abrir(s.nome) },
          el("span", { class: "tile-top" }, el("span", { class: "tile-name" }, s.nome), pill(s.nivel)),
          s.incidentes.length ? tx("p", { class: "tile-note" }, s.incidentes.map((i) => i.titulo).join(" | "))
                              : el("p", { class: "tile-note" }, t.semIncidente)))))));

  if (ABERTO) preencher(ABERTO);
}

// prazo -> [texto, pode traduzir?]. Data reconhecida vira horario local de quem ve; hora que nao deu para
// converter fica no original (o tradutor ja trocou "12:30 AM" por "12h30"); o resto ("4 hours") e traduzido.
function prazo(v, ditoEm, dito) {
  const d = Date.parse(v.replace(/^[A-Za-z]+day,\s*/i, "").replace(/,?\s+at\s+/i, " ").replace(/,(?=\s*\d{1,2}:)/, ""));
  if (!isNaN(d)) return [new Date(d).toLocaleString(T[LANG].locale, { dateStyle: "full", timeStyle: "short" }), false];
  if (/\d{1,2}[:h]\d{2}|\b(?:AM|PM)\b/i.test(v)) return [v + dito(ditoEm), false];
  return [v + dito(ditoEm), true];
}

function preencher(nome) {
  const t = T[LANG];
  const s = ATUAL.find((x) => x.nome === nome);
  if (!s) return;
  $("p-head").dataset.nivel = s.nivel;
  $("p-nome").textContent = s.nome;
  $("p-estado").textContent = t.estado[s.nivel];
  const corpo = [el("p", {}, el("a", { href: s.link, target: "_blank", rel: "noopener" }, t.pagina))];
  if (!s.incidentes.length) corpo.push(el("p", {}, s.nivel === "erro" ? t.erroPainel : s.nivel === "espera" ? t.conferindo : t.okPainel));
  for (const i of s.incidentes) {
    const dito = (q) => (q ? ` (${t.dito} ${quando(q)})` : "");
    const fatos = [];
    if (i.fimManut) fatos.push([t.fimManut, quando(i.fimManut, "medium")]);
    if (i.previsao) fatos.push([t.previsao, ...prazo(i.previsao, i.previsaoDita, dito)]);
    else fatos.push([t.previsao, t.semPrevisao, false]);
    if (i.proxima) fatos.push([t.proxima, ...prazo(i.proxima, i.proximaDita, dito)]);
    corpo.push(el("article", { class: "inc" },
      tx("h3", {}, i.titulo),
      el("p", { class: "meta" }, [i.status, i.inicio && `${t.inicio}: ${quando(i.inicio)}`,
        i.atualizado && `${t.atualizado}: ${relativo(i.atualizado)}`].filter(Boolean).join("  |  ")),
      el("dl", { class: "facts" }, ...fatos.map(([k, v, trad]) => el("div", { class: "fact" }, el("dt", {}, k), trad ? tx("dd", {}, v) : el("dd", {}, v)))),
      i.resumo && el("h4", {}, t.impacto), i.resumo && tx("p", { class: "resumo" }, i.resumo.replace(/\s-\s(?=\S)/g, "\n• ")),
      i.afetados.length > 0 && el("h4", {}, t.afetados),
      i.afetados.length > 0 && el("ul", { class: "chips" }, ...i.afetados.slice(0, 24).map((a) => el("li", {}, a))),
      i.atualizacoes.length > 0 && el("h4", {}, t.historico),
      i.atualizacoes.length > 0 && el("ol", { class: "timeline" }, ...i.atualizacoes.slice(0, 12).map((u) => el("li", {},
        el("time", { datetime: u.quando || "" }, u.quando ? quando(u.quando) : ""), u.status && el("b", {}, u.status),
        tx("p", {}, u.texto))))));
  }
  if (s.incidentes.length) corpo.push(el("p", { class: "orig" }, t.orig));
  $("p-corpo").replaceChildren(...corpo);
}

function abrir(nome) {
  ABERTO = nome;
  dica();
  history.replaceState(null, "", "#" + encodeURIComponent(nome));  // link direto para o painel
  preencher(nome);
  const d = $("painel");
  if (!d.open) d.showModal();
}

async function ciclo() {
  SRV = await json(DADOS + "?t=" + Date.now()).catch(() => null);
  ATUAL = await conferir(SRV);
  desenhar();
}

if (typeof document !== "undefined") {
  try { LANG = localStorage.getItem("lang") || ""; } catch (e) { LANG = ""; }
  if (!T[LANG]) LANG = (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    try { localStorage.setItem("lang", LANG); } catch (e) {}
    desenhar();
  }));
  const d = $("painel");
  $("fechar").addEventListener("click", () => d.close());
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });  // clique fora fecha
  d.addEventListener("close", () => { ABERTO = null; history.replaceState(null, "", location.pathname); });
  ATUAL = FONTES.map((f) => ({ ...f, nivel: "espera", incidentes: [] }));
  desenhar();
  const alvo = decodeURIComponent(location.hash.slice(1));
  ciclo().then(() => { if (alvo && ATUAL.some((s) => s.nome === alvo)) abrir(alvo); });
  setInterval(ciclo, 60000);
}
